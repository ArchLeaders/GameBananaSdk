name: "Publish NuGet Package"

on:
  push:
    tags:
      - "v*"

env:
  nuget: "https://api.nuget.org/v3/index.json"

jobs:
  deploy:
    name: Publish NuGet Package
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: GameBananaSdk
      
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
      
      - name: Setup .NET Core SDK
        uses: actions/setup-dotnet@v6.1.0
        with:
          dotnet-version: "10.0.x"
      
      - name: Restore
        shell: bash
        run: |-
          dotnet restore src/${{ matrix.config.name }}/${{ matrix.config.name }}.csproj
          
          - name: Build
            shell: bash
            run: |-
              dotnet build src/${{ matrix.config.name }}/${{ matrix.config.name }}.csproj \
              --no-restore                                                                \
              -c Release                                                                  \
          
          - name: Fetch Version
            id: version
            uses: battila7/get-version-action@v2

      - name: Package
        shell: bash
        run: |
          dotnet pack src/${{ matrix.config.name }}/${{ matrix.config.name }}.csproj \
          --no-restore                                                               \
          -c Release                                                                 \
          -o ./build-output/                                                         \
          -p:PackageVersion="${{ steps.version.outputs.version-without-v }}"         \
      
      - name: NuGet login (OIDC → temp API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}
      
      - name: Push
        shell: bash
        run: |-
          dotnet nuget push ./build-output/*.nupkg \
          --api-key ${{ steps.login.outputs.NUGET_API_KEY }} \
          -s ${{ env.nuget }}